name: grok-account-manager

services:
  gateway:
    container_name: "${GROK_ACCOUNT_MANAGER_GATEWAY_CONTAINER:-grok-account-manager-gateway}"
    # Build the vendored gateway from this repository.  No grok2api image is
    # pulled or required on a user's machine.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GATEWAY_SOURCE_REVISION: "${GATEWAY_SOURCE_REVISION:-local}"
    image: "${GROK_ACCOUNT_MANAGER_GATEWAY_IMAGE:-grok-account-manager-gateway:local}"
    ports:
      - "${GROK_ACCOUNT_MANAGER_GATEWAY_PORT:-43871}:8000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # The bundled backend keeps this compatibility key internally.
      GROK2API_DATABASE_URL: "${GROK2API_DATABASE_URL:-}"
      GROK2API_QUALITY_GUARD_DIR: /var/lib/grok2api-quality-guard
    volumes:
      - "${GROK_ACCOUNT_MANAGER_CONFIG:-./config.yaml}:/run/grok2api/config.yaml:ro"
      - grok_account_manager_gateway_data:/app/data
      - grok_account_manager_quality_guard_state:/var/lib/grok2api-quality-guard
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  # ================================ WARP ================================
  # 如果出口 IP 不干净，可取消以下注释使用 WARP 作为落地代理。
  # 启用后，在管理端“设置 -> 出口代理”中新增 socks5://warp:1080。

  # warp:
  #   container_name: warp
  #   image: caomingjun/warp:latest
  #   profiles: ["warp"]
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:1080:1080"
  #   environment:
  #     - WARP_SLEEP=2
  #   cap_add:
  #     - NET_ADMIN

  # ================================ FLARESOLVERR ================================
  # 在管理端将 Clearance 模式设为 FlareSolverr 或按需刷新，并使用 http://flaresolverr:8191。
  # 启动命令：docker compose --profile flaresolverr up -d
  # Podman：podman compose --profile flaresolverr up -d

  # flaresolverr:
  #   container_name: flaresolverr
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   profiles: ["flaresolverr"]
  #   environment:
  #     TZ: Asia/Shanghai
  #     LOG_LEVEL: info
  #   restart: unless-stopped

  # ================================ EGRESS QUALITY GUARD ================================
  # 可选的 Grok Build 出口质量守护 sidecar。默认不启动，也不会产生探测请求。
  # 启用前在 config.yaml 中配置 qualityGuard，然后执行：
  # docker compose --profile quality-guard up -d --build

  egress-quality-guard:
    container_name: grok-account-manager-egress-quality-guard
    profiles: ["quality-guard"]
    build:
      context: .
      dockerfile: tools/egress-quality-guard/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    volumes:
      - grok_account_manager_quality_guard_state:/var/lib/grok2api-quality-guard
    restart: "on-failure:5"
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  grok_account_manager_gateway_data:
  grok_account_manager_quality_guard_state:
