[project]
 name = "grok-account-manager"
version = "0.1.0"
description = "MSDSJ Grok account registration and credential manager"
readme = "README.md"
license = { file = "LICENSE" }
# 上限保留给邮箱与浏览器自动化稳定性；升级 Python 前需要重新验证注册流程。
requires-python = ">=3.12,<3.14"
dependencies = [
    "DrissionPage==4.1.0.9",
    "fastapi>=0.115",
    "psutil>=5.9",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
grok-account-manager = "grok_account_manager.cli:main"
grok-account-manager-api = "grok_account_manager.api.main:main"
grok-account-manager-web = "grok_account_manager.api.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serve/grok_account_manager"]

[tool.uv]
package = true
