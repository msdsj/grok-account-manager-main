name: Build Project Gateway Image

on:
  push:
    branches: [main, master]
    paths:
      - "gateway/**"
      - "serve/grok_account_manager/api/services/relay.py"
      - ".github/workflows/gateway-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Read bundled gateway revision
        id: gateway
        shell: bash
        run: echo "revision=$(tr -d '[:space:]' < gateway/UPSTREAM_REVISION)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish project-owned image
        uses: docker/build-push-action@v6
        with:
          context: gateway
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/grok-account-manager-gateway:latest
            ghcr.io/${{ github.repository_owner }}/grok-account-manager-gateway:${{ github.sha }}
          build-args: |
            GATEWAY_SOURCE_REVISION=${{ steps.gateway.outputs.revision }}
